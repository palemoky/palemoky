<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Palemoky</title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
  <link rel="stylesheet" href="assets/css/styles.css?v=2" />
  <!-- 防止暗色模式与语言首屏闪烁：进入 body 前确定主题和语言 -->
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);

      var l = localStorage.getItem("lang");
      if (l !== "zh" && l !== "en") {
        l = ((navigator.language || "").toLowerCase().indexOf("zh") === 0) ? "zh" : "en";
      }
      window.__LANG = l;
      document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
    })();
  </script>
</head>
<body>
  <header class="nav">
    <div class="nav__right">
      <ul class="social" data-social></ul>
      <button class="lang-toggle" type="button" aria-label="切换语言 / Switch language" data-lang-toggle></button>
      <button class="theme-toggle" type="button" aria-label="切换主题" data-theme-toggle>
        <span class="theme-toggle__icon" data-theme-icon></span>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- 首屏：个人介绍 -->
    <section class="hero">
      <p class="hero__badge" data-hero-badge></p>
      <h1 class="hero__name" data-hero-name></h1>
      <p class="hero__tagline" data-hero-tagline></p>
      <p class="hero__bio" data-hero-bio></p>
      <dl class="hero__skills" data-skills></dl>
      <div class="hero__actions" data-hero-actions></div>
    </section>

    <!-- 分组卡片：笔记 / 开源项目 / 小玩具 -->
    <section class="section" id="groups" data-groups-section>
      <div class="grid" data-groups></div>
    </section>

    <!-- 赞助 -->
    <section class="section" id="sponsor" data-sponsor-section>
      <h2 class="section__title" data-sponsor-title></h2>
      <p class="section__intro" data-sponsor-intro></p>
      <div class="sponsor" data-sponsor></div>
    </section>
  </main>

  <footer class="footer" data-footer></footer>

  <script src="assets/js/content.js?v=2"></script>
  <script src="assets/js/main.js?v=2"></script>
</body>
</html>
